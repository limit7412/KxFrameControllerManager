<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KxFrameControllerManager</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #15171c;
    --panel: #1f232b;
    --line: #333944;
    --text: #e8eaee;
    --muted: #9aa3b2;
    --accent: #5aa9ff;
    --ok: #4cc38a;
    --warn: #e5b454;
    --ng: #ef6b6b;
    --danger: #d9534f;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --line: #d9dde3;
      --text: #1d2129;
      --muted: #5d6675;
      --accent: #1f6fd1;
      --ok: #1c8c58;
      --warn: #a7700f;
      --ng: #c33b3b;
      --danger: #c33b3b;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
  }
  header, main { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 20px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  header .version { color: var(--muted); font-size: 14px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    margin: 16px 0;
  }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; align-items: center; }
  .muted { color: var(--muted); }
  .note { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
  .ok { color: var(--ok); }
  .warn { color: var(--warn); }
  .ng { color: var(--ng); }
  .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 15px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .row:first-of-type { border-top: 0; }
  .row label { flex: 1 1 220px; }
  .row .hint { display: block; color: var(--muted); font-size: 14px; }
  select, input[type=number] {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    min-height: 44px;
    min-width: 160px;
  }
  input[type=number] { width: 160px; }
  input[type=checkbox] { width: 26px; height: 26px; accent-color: var(--accent); }
  input[type=range] { width: 200px; accent-color: var(--accent); }
  button {
    font: inherit;
    min-height: 48px;
    padding: 8px 18px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { border-color: var(--danger); color: var(--danger); }
  button.danger.armed { background: var(--danger); color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  .actions { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .message { margin: 0; }
  ul.errors { margin: 8px 0 0; padding-left: 20px; color: var(--ng); }
  .dirty { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>KxFrameControllerManager</h1>
  <span class="version" id="version"></span>
</header>
<main>
  <section id="status">
    <h2 data-t="status.title"></h2>
    <div class="grid">
      <span data-t="status.steamvr"></span><span id="steamvr"></span>
      <span data-t="status.left"></span><span id="hand-left"></span>
      <span data-t="status.right"></span><span id="hand-right"></span>
      <span data-t="status.link"></span><span id="link"></span>
      <span data-t="status.power_save"></span><span id="power-save"></span>
    </div>
    <ul class="errors" id="config-errors" hidden></ul>
    <p class="note" id="connection-lost" hidden></p>
  </section>

  <section>
    <h2 data-t="disconnect.title"></h2>
    <div class="buttons">
      <button class="danger" data-disconnect="left" data-t="disconnect.left"></button>
      <button class="danger" data-disconnect="right" data-t="disconnect.right"></button>
      <button class="danger" data-disconnect="both" data-t="disconnect.both"></button>
      <button id="list-button" data-t="disconnect.list"></button>
    </div>
    <p class="message" id="disconnect-message"></p>
    <div id="controllers" class="mono"></div>
    <p class="note" data-t="disconnect.note"></p>
  </section>

  <form id="form" autocomplete="off" novalidate>
    <section>
      <h2 data-t="hold.title"></h2>
      <div class="row">
        <label for="power_off.enabled" data-t="hold.enabled"></label>
        <input type="checkbox" id="power_off.enabled">
      </div>
      <div class="row">
        <label for="input.left_button" data-t="hold.left_button"></label>
        <select id="input.left_button"></select>
      </div>
      <div class="row">
        <label for="input.right_button" data-t="hold.right_button"></label>
        <select id="input.right_button"></select>
      </div>
      <div class="row">
        <label for="power_off.hold_ms"><span data-t="hold.hold_ms"></span><span class="hint" data-t="hold.hold_ms_hint"></span></label>
        <input type="number" id="power_off.hold_ms" min="500" max="10000" step="100">
      </div>
      <div class="row">
        <label for="power_off.warn_ms"><span data-t="hold.warn_ms"></span><span class="hint" data-t="hold.warn_ms_hint"></span></label>
        <input type="number" id="power_off.warn_ms" min="0" max="9500" step="100">
      </div>
      <div class="row">
        <label for="power_off.cooldown_ms" data-t="hold.cooldown_ms"></label>
        <input type="number" id="power_off.cooldown_ms" min="0" max="60000" step="500">
      </div>
      <div class="row">
        <label for="power_off.target" data-t="hold.target"></label>
        <select id="power_off.target">
          <option value="pressed" data-t="hold.target_pressed"></option>
          <option value="both" data-t="hold.target_both"></option>
        </select>
      </div>
      <div class="row">
        <label for="input.priority"><span data-t="hold.priority"></span><span class="hint" data-t="hold.priority_hint"></span></label>
        <select id="input.priority">
          <option value="normal" data-t="hold.priority_normal"></option>
          <option value="overlay_global" data-t="hold.priority_overlay_global"></option>
        </select>
      </div>
      <p class="note" data-t="hold.binding_note"></p>
    </section>

    <section>
      <h2 data-t="feedback.title"></h2>
      <div class="row">
        <label for="feedback.haptics" data-t="feedback.haptics"></label>
        <input type="checkbox" id="feedback.haptics">
      </div>
      <div class="row">
        <label for="feedback.amplitude" data-t="feedback.amplitude"></label>
        <span><input type="range" id="feedback.amplitude" min="0" max="1" step="0.05"> <span id="amplitude-value" class="mono"></span></span>
      </div>
    </section>

    <section>
      <h2 data-t="power_save.title"></h2>
      <div class="row">
        <label for="power_save.enabled"><span data-t="power_save.enabled"></span><span class="hint" data-t="power_save.enabled_hint"></span></label>
        <input type="checkbox" id="power_save.enabled">
      </div>
      <div class="row">
        <label for="power_save.delay_s" data-t="power_save.delay_s"></label>
        <input type="number" id="power_save.delay_s" min="0" max="600" step="1">
      </div>
      <div class="row">
        <label for="power_save.brightness" data-t="power_save.brightness"></label>
        <input type="checkbox" id="power_save.brightness">
      </div>
      <div class="row">
        <label for="gain-auto"><span data-t="power_save.gain_auto"></span><span class="hint" id="gain-range"></span></label>
        <input type="checkbox" id="gain-auto">
      </div>
      <div class="row" id="gain-row">
        <label for="power_save.brightness_gain" data-t="power_save.gain"></label>
        <input type="number" id="power_save.brightness_gain" min="0.01" step="any">
      </div>
      <div class="row">
        <label for="power_save.performance_profile" data-t="power_save.performance_profile"></label>
        <input type="checkbox" id="power_save.performance_profile">
      </div>
    </section>

    <div class="actions">
      <button type="submit" class="primary" id="save" data-t="form.save"></button>
      <button type="button" id="revert" data-t="form.revert"></button>
      <span id="form-message" class="message"></span>
      <ul class="errors" id="form-errors" hidden></ul>
    </div>
  </form>
</main>

  var locale = (navigator.language || "").toLowerCase().indexOf("ja") === 0 ? "ja" : "en";
  var saved = null;
  var dirty = false;

  function t(key, vars) {
    var text = (TEXT[locale] && TEXT[locale][key]) || TEXT.ja[key] || key;
    if (vars) {
      text = text.replace(/\{(\w+)\}/g, function (all, name) { return name in vars ? String(vars[name]) : all; });
    }
    return text;
  }

  function $(id) { return document.getElementById(id); }

  function translate() {
    document.documentElement.lang = locale;
    document.querySelectorAll("[data-t]").forEach(function (node) {
      node.textContent = t(node.getAttribute("data-t"));
    });
  }

  function api(method, path, body) {
    var options = { method: method, headers: { "X-KxFCM": "1" } };
    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    return fetch(path, options).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        return { ok: response.ok, status: response.status, data: data };
      });
    });
  }

  function setText(id, text, cls) {
    var node = $(id);
    node.textContent = text;
    node.className = cls || "";
  }

  function renderState(state) {
    $("connection-lost").hidden = true;
    $("version").textContent = state.version;
    if (state.locale && TEXT[state.locale] && state.locale !== locale) {
      locale = state.locale;
      translate();
      fillButtons();
      updateGainHint();
    }
    lastState = state;
    setText("steamvr", t(state.steamvr_connected ? "status.connected" : "status.not_connected"), state.steamvr_connected ? "ok" : "ng");
    ["left", "right"].forEach(function (hand) {
      var info = state.hands[hand];
      var text = t(info.connected ? "status.hand_connected" : "status.hand_not_connected");
      if (info.serial) { text += " · " + info.serial; }
      text += " · " + t("button." + info.button);
      setText("hand-" + hand, text, info.connected ? "ok" : "muted");
    });
    if (state.link_reachable === null) {
      setText("link", t("status.link_unknown"), "muted");
    } else {
      setText("link", t(state.link_reachable ? "status.link_ok" : "status.link_ng"), state.link_reachable ? "ok" : "ng");
    }
    var ps = t("status.ps_" + state.power_save_state);
    if (state.power_save_pending && state.power_save_state !== "active") { ps += " · " + t("status.ps_pending"); }
    setText("power-save", ps, state.power_save_state === "active" ? "warn" : (state.power_save_pending ? "warn" : ""));

    var errors = $("config-errors");
    errors.innerHTML = "";
    if (state.config_errors.length > 0) {
      var head = document.createElement("li");
      head.textContent = t("status.config_errors");
      errors.appendChild(head);
      state.config_errors.forEach(function (message) {
        var item = document.createElement("li");
        item.textContent = message;
        errors.appendChild(item);
      });
    }
    errors.hidden = state.config_errors.length === 0;
    document.querySelectorAll("[data-disconnect]").forEach(function (button) {
      if (!button.classList.contains("armed")) { button.disabled = state.busy || running; }
    });
    updateGainHint();
  }

  var lastState = null;
  var buttonsCatalog = { left: [], right: [] };

  function refreshState() {
    api("GET", "/api/state").then(function (result) {
      if (result.ok) { renderState(result.data); }
    }).catch(function () {
      var note = $("connection-lost");
      note.textContent = t("status.lost");
      note.hidden = false;
    });
  }

  // 設定の入力欄。id は "セクション.キー" の形で、設定ファイルの項目と同じ名前にしてある。
  var FIELDS = [
    "power_off.enabled", "power_off.target", "power_off.hold_ms", "power_off.warn_ms", "power_off.cooldown_ms",
    "input.left_button", "input.right_button", "input.priority",

    "power_save.enabled", "power_save.delay_s", "power_save.brightness", "power_save.brightness_gain", "power_save.performance_profile"
  ];

  function fillButtons() {
    ["left", "right"].forEach(function (hand) {
      var select = $("input." + hand + "_button");
      var current = select.value;
      select.innerHTML = "";
      buttonsCatalog[hand].forEach(function (name) {
        var option = document.createElement("option");
        option.value = name;
        option.textContent = t("button." + name);
        select.appendChild(option);
      });
      if (current) { select.value = current; }
    });
  }

  function fillForm(config) {
    FIELDS.forEach(function (id) {
      var parts = id.split(".");
      var value = config[parts[0]][parts[1]];
      var node = $(id);
      if (node.type === "checkbox") {
        node.checked = !!value;
      } else if (id === "power_save.brightness_gain") {
        node.value = value === null ? "" : value;
      } else {
        node.value = value;
      }
    });
    $("gain-auto").checked = config.power_save.brightness_gain === null;
    syncGain();
    syncAmplitude();
    setDirty(false);
  }

  function readForm() {
    var patch = {};
    FIELDS.forEach(function (id) {
      var parts = id.split(".");
      var node = $(id);
      var value;
      if (node.type === "checkbox") {
        value = node.checked;
      } else if (node.type === "number" || node.type === "range") {
        value = node.value === "" ? null : Number(node.value);
      } else {
        value = node.value;
      }
      if (id === "power_save.brightness_gain" && $("gain-auto").checked) { value = null; }
      patch[parts[0]] = patch[parts[0]] || {};
      patch[parts[0]][parts[1]] = value;
    });
    return patch;
  }

  function syncGain() {
    var auto = $("gain-auto").checked;
    $("gain-row").hidden = auto;
    var gain = $("power_save.brightness_gain");
    if (!auto && gain.value === "" && lastState && lastState.gain_range) {
      gain.value = lastState.gain_range[0];
    }
  }

  function updateGainHint() {
    var hint = $("gain-range");
    if (lastState && lastState.gain_range) {
      hint.textContent = t("power_save.gain_range", { min: lastState.gain_range[0], max: lastState.gain_range[1] });
      $("power_save.brightness_gain").min = lastState.gain_range[0];
      $("power_save.brightness_gain").max = lastState.gain_range[1];
    } else {
      hint.textContent = "";
    }
  }

  function syncAmplitude() {
    $("amplitude-value").textContent = Number($("feedback.amplitude").value).toFixed(2);
  }

  function setDirty(value) {
    dirty = value;
    var message = $("form-message");
    if (value) {
      message.textContent = t("form.dirty");
      message.className = "message dirty";
    } else if (message.classList.contains("dirty")) {
      message.textContent = "";
      message.className = "message";
    }
  }

  function showErrors(listId, messages) {
    var list = $(listId);
    list.innerHTML = "";
    (messages || []).forEach(function (text) {
      var item = document.createElement("li");
      item.textContent = text;
      list.appendChild(item);
    });
    list.hidden = !messages || messages.length === 0;
  }

  function loadConfig() {
    return api("GET", "/api/config").then(function (result) {
      if (!result.ok) { return; }
      buttonsCatalog = result.data.buttons;
      fillButtons();
      saved = result.data.config;
      fillForm(saved);
    });
  }

  $("form").addEventListener("input", function (event) {
    if (event.target.id === "feedback.amplitude") { syncAmplitude(); }
    if (event.target.id === "gain-auto") { syncGain(); }
    setDirty(true);
  });
  $("form").addEventListener("change", function () { setDirty(true); });

  $("form").addEventListener("submit", function (event) {
    event.preventDefault();
    var button = $("save");
    button.disabled = true;
    showErrors("form-errors", []);
    api("PUT", "/api/config", readForm()).then(function (result) {
      if (result.ok) {
        saved = result.data.config;
        fillForm(saved);
        $("form-message").textContent = t("form.saved");
        $("form-message").className = "message ok";
        refreshState();
      } else {
        $("form-message").textContent = t("form.failed");
        $("form-message").className = "message ng";
        showErrors("form-errors", result.data.errors);
      }
    }).catch(function () {
      $("form-message").textContent = t("form.unreachable");
      $("form-message").className = "message ng";
    }).then(function () { button.disabled = false; });
  });

  $("revert").addEventListener("click", function () {
    if (saved) { fillForm(saved); }
    showErrors("form-errors", []);
    $("form-message").textContent = "";
  });

  // 切断のボタンは 2 回押しで動かす。VR の中では誤って触れやすく、確認のダイアログも出しにくい。
  var running = false;
  var armTimer = null;
  function disarm() {
    document.querySelectorAll("[data-disconnect]").forEach(function (button) {
      button.classList.remove("armed");
      button.textContent = t(button.getAttribute("data-t"));
    });
    if (armTimer) { clearTimeout(armTimer); armTimer = null; }
  }

  document.querySelectorAll("[data-disconnect]").forEach(function (button) {
    button.addEventListener("click", function () {
      if (running) { return; }
      if (!button.classList.contains("armed")) {
        disarm();
        button.classList.add("armed");
        button.textContent = t("disconnect.confirm");
        armTimer = setTimeout(disarm, 4000);
        return;
      }
      disarm();
      running = true;
      document.querySelectorAll("[data-disconnect]").forEach(function (b) { b.disabled = true; });
      var message = $("disconnect-message");
      message.textContent = t("disconnect.running");
      message.className = "message";
      api("POST", "/api/disconnect", { target: button.getAttribute("data-disconnect") }).then(function (result) {
        if (result.status === 409) {
          message.textContent = t("disconnect.busy");
          message.className = "message warn";
        } else if (!result.ok) {
          message.textContent = (result.data.errors || []).join(" / ");
          message.className = "message ng";
        } else if (result.data.results.length === 0) {
          message.textContent = t("disconnect.no_target");
          message.className = "message ng";
        } else {
          message.textContent = result.data.results.map(function (r) {
            return r.target + ": " + t("disconnect." + r.outcome);
          }).join(" / ");
          var all = result.data.results.every(function (r) { return r.outcome === "disconnected"; });
          message.className = "message " + (all ? "ok" : "warn");
        }
      }).catch(function () {
        message.textContent = t("form.unreachable");
        message.className = "message ng";
      }).then(function () {
        running = false;
        refreshState();
      });
    });
  });

  $("list-button").addEventListener("click", function () {
    var box = $("controllers");
    box.textContent = "…";
    api("GET", "/api/controllers").then(function (result) {
      box.innerHTML = "";
      if (!result.ok) { box.textContent = t("list.failed"); return; }
      var lines = [];
      result.data.connected.forEach(function (c) { lines.push(t("list.connected") + ": " + c.serial + (c.hand ? " (" + c.hand + ")" : "")); });
      result.data.paired.forEach(function (serial) { lines.push(t("list.paired") + ": " + serial); });
      if (result.data.connected.length === 0) { lines.unshift(t("list.none")); }
      lines.forEach(function (line) {
        var div = document.createElement("div");
        div.textContent = line;
        box.appendChild(div);
      });
    }).catch(function () { box.textContent = t("form.unreachable"); });
  });

  translate();
  loadConfig().then(refreshState);
  setInterval(refreshState, 2000);
})();
</script>
</body>
</html>
